<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RESPONSIVE GRID GALLERY</title>
<style>
body {
  margin: 0;
  font-family: arial;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  padding: 10px;
}

.gallery img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  border-radius: 8px;
}
</style>
</head>

<body>

<div class="gallery">
  <img src="https://tse4.mm.bing.net/th/id/OIP.hXWwNOQw15ZVWKlMs-xv0wHaFQ?rs=1&pid=ImgDetMain&o=7&rm=3">
  <img src="https://tse2.mm.bing.net/th/id/OIP.e6voHjED4omwbyU6TqoCmwHaE8?rs=1&pid=ImgDetMain&o=7&rm=3">
  <img src="https://tse4.mm.bing.net/th/id/OIP.kKSNTRAx0Zm792CEpN6v4AHaEI?w=4000&h=2236&rs=1&pid=ImgDetMain&o=7&rm=3">
  <img src="https://tse2.mm.bing.net/th/id/OIP.G37tgeQqSNt7v2oPfj9ltQHaE7?rs=1&pid=ImgDetMain&o=7&rm=3">
  <img src="https://images.pexels.com/photos/210186/pexels-photo-210186.jpeg">
</div>

</body>
</html>
