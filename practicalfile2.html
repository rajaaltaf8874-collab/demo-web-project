<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Grid Gallery</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        padding: 20px;
    }

    h1 {
        text-align: center;
        margin-bottom: 20px;
    }

    .gallery {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 15px;
    }

    .gallery img {
        width: 100%;
        height: 250px;
        object-fit: cover;
        border-radius: 8px;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .gallery img:hover {
        transform: scale(1.05);
        box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    /* Tablet */
    @media (max-width: 992px) {
        .gallery {
            grid-template-columns: repeat(3, 1fr);
        }
    }

    /* Small tablets */
    @media (max-width: 768px) {
        .gallery {
            grid-template-columns: repeat(2, 1fr);
        }
    }

    /* Mobile */
    @media (max-width: 480px) {
        .gallery {
            grid-template-columns: 1fr;
        }
    }
</style>
</head>

<body>

<h1>Responsive Image Gallery</h1>

<div class="gallery">
    <img src="https://picsum.photos/id/1015/600/400" alt="Image 1">
    <img src="https://picsum.photos/id/1016/600/400" alt="Image 2">
    <img src="https://picsum.photos/id/1018/600/400" alt="Image 3">
    <img src="https://picsum.photos/id/1020/600/400" alt="Image 4">
    <img src="https://picsum.photos/id/1024/600/400" alt="Image 5">
    <img src="https://picsum.photos/id/1027/600/400" alt="Image 6">
    <img src="https://picsum.photos/id/1035/600/400" alt="Image 7">
    <img src="https://picsum.photos/id/1043/600/400" alt="Image 8">
</div>

</body>
</html>
