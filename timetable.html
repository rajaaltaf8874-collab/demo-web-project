<!DOCTYPE html>
<html>
<head>
    <title>Time Table</title>

    <style>
        table {
            border-collapse: collapse;
            width: 60%;
            margin: auto;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }

        th {
            background-color: lightblue;
        }
    </style>

</head>
<body>

<h2 align="center">Class Time Table</h2>

<table>
    <tr>
        <th>Day</th>
        <th>9-10</th>
        <th>10-11</th>
        <th>11-12</th>
    </tr>

    <tr>
        <td>Monday</td>
        <td>Maths</td>
        <td>Physics</td>
        <td>C++</td>
    </tr>

    <tr>
        <td>Tuesday</td>
        <td>English</td>
        <td>Maths</td>
        <td>Lab</td>
    </tr>

    <tr>
        <td>Wednesday</td>
        <td>Physics</td>
        <td>C++</td>
        <td>Sports</td>
    </tr>

</table>

</body>
</html>
